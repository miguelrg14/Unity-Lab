# One-off: runs ProjectMigration in the Unity Editor (batch mode) and pushes the resulting
# project files to the migration-output branch, from where they are reviewed and committed.
# Triggered by changing .github/migrate.trigger.
name: Editor migration

on:
  push:
    paths:
      - .github/migrate.trigger
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          targetPlatform: StandaloneLinux64
          buildMethod: UnityLab.EditorTools.ProjectMigration.RunFollowUpFromCommandLine
          versioning: None
          allowDirtyBuild: true

      - name: Push the migrated project to the migration-output branch
        run: |
          sudo chown -R "$(id -u):$(id -g)" UnityProject
          git config user.name "Miguel Rodríguez Gallego"
          git config user.email "miguelrodriguezgallego1@gmail.com"
          git checkout -B migration-output
          git add -A UnityProject
          git add -f UnityProject/migration-report.txt
          git commit -q -m "Editor migration output"
          git push -f origin migration-output
